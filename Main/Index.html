<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariposa Azul</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="video-background">
        <video id="videoFondo" autoplay muted  playsinline>
            <source src="video1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="header">
        <h1> Mariposa Azul</h1>

        <div class="menu">
            <a href="#inicio">Inicio</a>
            <a href="#noticias">Noticias</a>
            <a href="#articulos">Artículos</a>
            <a href="#contacto">Contacto</a>
        </div>

        <button class="btn-shine" id="temaBtn">
            <span>🌙</span>
        </button>
    </div>

    <div class="contenido">
        <h2>Noticias Accesibles</h2>
        <p>Bienvenido a Mariposa Azul.</p>
    </div>

    <script>
        // lógica  de reproducción aleatoria
            "video1.mp4",
            "video2.mp4",
            "video3.mp4",
            
        ];

        let actual = 0;
        const video = document.getElementById("videoFondo");

        video.addEventListener("ended", () => {
            actual = (actual + 1) % videos.length;
            video.src = videos[actual];
            video.play();
        });

        // Modo oscuro
        const btn = document.getElementById("temaBtn");
        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            if (document.body.classList.contains("dark-mode")) {
                btn.innerHTML = "<span>☀️</span>";
            } else {
                btn.innerHTML = "<span>🌙</span>";
            }
        });
    </script>
</body>
</html>
